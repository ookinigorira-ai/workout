<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TRAINLOG">
<title>TRAINLOG</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --bg2: #111118;
  --bg3: #1a1a24;
  --bg4: #222230;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0f0f8;
  --muted: #6a6a80;
  --muted2: #9090a8;
  --accent: #00e5a0;
  --accent2: #00b87a;
  --accent-dim: rgba(0,229,160,0.1);
  --accent-dim2: rgba(0,229,160,0.06);
  --orange: #ff8c42;
  --orange-dim: rgba(255,140,66,0.12);
  --red: #ff4d6d;
  --red-dim: rgba(255,77,109,0.12);
  --blue: #4d9fff;
  --blue-dim: rgba(77,159,255,0.1);
  --purple: #a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:80px;overflow-x:hidden;}

/* Grain overlay */
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.4;}

/* Header */
.header{background:linear-gradient(180deg,rgba(0,229,160,0.06) 0%,transparent 100%);border-bottom:1px solid var(--border);padding:52px 20px 16px;position:sticky;top:0;z-index:50;backdrop-filter:blur(20px);}
.header-top{display:flex;align-items:flex-end;justify-content:space-between;}
.header-eyebrow{font-family:'Bebas Neue',sans-serif;font-size:11px;color:var(--accent);letter-spacing:4px;margin-bottom:2px;}
.header-title{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--text);letter-spacing:2px;line-height:1;}
.header-streak{display:inline-flex;align-items:center;gap:5px;background:var(--orange-dim);border:1px solid rgba(255,140,66,0.2);color:var(--orange);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,15,0.95);border-top:1px solid var(--border);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:100;backdrop-filter:blur(20px);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;background:none;border:none;cursor:pointer;font-family:inherit;}
.nav-icon{font-size:18px;opacity:0.4;transition:all 0.2s;}
.nav-label{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
.nav-btn.active .nav-icon{opacity:1;}
.nav-btn.active .nav-label{color:var(--accent);}

.content{padding:16px;position:relative;z-index:1;}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;}
.card-accent{background:linear-gradient(135deg,rgba(0,229,160,0.08) 0%,rgba(0,229,160,0.02) 100%);border:1px solid rgba(0,229,160,0.15);border-radius:16px;padding:16px;margin-bottom:12px;}
.section-label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;}

/* Part selector — スタイリッシュ英字 */
.part-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.part-btn{padding:14px 6px 12px;border-radius:12px;border:1px solid var(--border2);background:var(--bg3);cursor:pointer;text-align:center;font-family:inherit;transition:all 0.2s;position:relative;overflow:hidden;}
.part-btn::before{content:'';position:absolute;inset:0;background:var(--accent);opacity:0;transition:opacity 0.2s;}
.part-btn.active::before{opacity:0.08;}
.part-btn.active{border-color:var(--accent);}
.part-en{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--muted2);line-height:1;display:block;transition:color 0.2s;}
.part-ja{font-size:10px;font-weight:700;color:var(--muted);margin-top:3px;display:block;letter-spacing:1px;transition:color 0.2s;}
.part-btn.active .part-en{color:var(--accent);}
.part-btn.active .part-ja{color:var(--accent2);}
.part-line{width:20px;height:2px;background:var(--border2);border-radius:1px;margin:5px auto 0;transition:all 0.2s;}
.part-btn.active .part-line{background:var(--accent);width:30px;}

/* Exercise list */
.ex-item{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);margin-bottom:7px;cursor:pointer;transition:all 0.15s;}
.ex-item:active{background:var(--bg4);}
.ex-name{font-size:14px;font-weight:600;color:var(--text);}
.ex-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:1px;color:var(--orange);background:var(--orange-dim);padding:2px 6px;border-radius:4px;margin-top:3px;}
.ex-arrow{font-size:14px;color:var(--muted);font-family:'Bebas Neue',sans-serif;letter-spacing:1px;}

/* Plan selector */
.plan-row{display:flex;gap:6px;margin-bottom:12px;}
.plan-btn{flex:1;padding:12px 4px;border-radius:10px;border:1px solid var(--border2);background:var(--bg3);cursor:pointer;text-align:center;font-family:inherit;transition:all 0.15s;}
.plan-btn.active{border-color:var(--accent);background:var(--accent-dim);}
.plan-level{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--muted2);}
.plan-btn.active .plan-level{color:var(--accent);}
.plan-detail{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600;}

/* Set recording */
.set-record-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;}
.set-record-card.active-set{border-color:var(--accent);background:rgba(0,229,160,0.04);}
.set-num{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.input-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.rep-input{flex:1;padding:12px;border-radius:8px;border:1px solid var(--border2);background:var(--bg4);font-size:24px;font-weight:700;text-align:center;font-family:'DM Mono',monospace;color:var(--text);-webkit-user-select:text;user-select:text;}
.rep-label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:1px;}
.giveup-btn{padding:10px 12px;border-radius:8px;border:1px solid rgba(255,77,109,0.3);background:var(--red-dim);color:var(--red);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:1px;}
.done-btn{padding:10px 16px;border-radius:8px;border:none;background:var(--accent);color:#000;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:1px;}
.set-done-num{font-size:22px;font-weight:800;font-family:'DM Mono',monospace;color:var(--accent);}
.set-done-label{font-size:11px;color:var(--muted);margin-left:4px;}
.set-giveup-label{font-size:11px;color:var(--red);font-weight:700;}

/* Progress bar */
.prog-wrap{height:3px;background:var(--bg4);border-radius:2px;margin-top:8px;}
.prog-bar{height:3px;background:var(--accent);border-radius:2px;transition:width 0.4s;}

/* Action buttons */
.action-btn{width:100%;padding:16px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;border:none;margin-bottom:8px;letter-spacing:1px;text-transform:uppercase;}
.action-btn.primary{background:var(--accent);color:#000;}
.action-btn.secondary{background:var(--bg3);color:var(--muted);border:1px solid var(--border);}

/* Tip */
.tip-card{background:var(--bg2);border:1px solid rgba(167,139,250,0.2);border-left:3px solid var(--purple);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:12px;color:var(--muted2);line-height:1.7;}

/* Comment */
.comment-card{background:var(--accent-dim2);border:1px solid rgba(0,229,160,0.15);border-radius:12px;padding:14px;margin-bottom:12px;}
.comment-text{font-size:15px;font-weight:600;color:var(--accent);line-height:1.5;}

/* Calendar */
.cal-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-nav-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);font-size:16px;cursor:pointer;color:var(--text);}
.cal-month{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:1px;padding:4px 0;}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--bg3);border:1px solid transparent;cursor:pointer;font-family:inherit;color:var(--muted2);}
.cal-cell.empty{background:none;cursor:default;}
.cal-cell.today{border-color:var(--accent);color:var(--accent);}
.cal-cell.has-workout{background:var(--accent-dim);color:var(--text);}
.cal-cell.has-workout.today{border-color:var(--accent);background:var(--accent);color:#000;font-weight:800;}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px;}
.cal-cell.has-workout.today .cal-dot{background:#000;}

/* Stats */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;line-height:1;}
.stat-label{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
.part-stat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.part-stat-en{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--muted2);width:60px;}
.part-stat-info{flex:1;}
.part-stat-count{font-size:11px;color:var(--muted);font-weight:600;}
.part-bar-wrap{width:80px;height:3px;background:var(--bg4);border-radius:2px;}
.part-bar{height:3px;background:var(--accent);border-radius:2px;transition:width 0.5s;}

/* Radar & Line chart */
.chart-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 12px;}
canvas{max-width:100%;}

/* Badge */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.badge-item{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;}
.badge-item.earned{background:rgba(255,140,66,0.08);border-color:rgba(255,140,66,0.25);}
.badge-emoji{font-size:24px;margin-bottom:4px;}
.badge-name{font-size:10px;font-weight:700;color:var(--muted);line-height:1.3;letter-spacing:0.5px;}
.badge-item.earned .badge-name{color:var(--orange);}
.badge-cond{font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:0.3px;}

/* Finish */
.finish-wrap{text-align:center;padding:30px 0 20px;}
.finish-big{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:3px;color:var(--accent);line-height:1;margin-bottom:6px;}
.finish-sub{font-size:13px;color:var(--muted2);line-height:1.7;margin-bottom:20px;}
.finish-stats{display:flex;justify-content:center;gap:30px;margin-bottom:20px;}
.finish-stat-num{font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--accent);}
.finish-stat-label{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:2px;text-transform:uppercase;}

/* Popup */
.popup-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:flex-end;backdrop-filter:blur(4px);}
.popup-box{background:var(--bg2);border-radius:20px 20px 0 0;border-top:1px solid var(--border2);padding:20px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-height:80vh;overflow-y:auto;}
.popup-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;margin-bottom:4px;}
.popup-close{width:100%;padding:13px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;letter-spacing:1px;text-transform:uppercase;}

/* back btn */
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;margin-bottom:14px;font-family:inherit;letter-spacing:1px;text-transform:uppercase;}
</style>
</head>
<body>
<div class="header">
  <div class="header-eyebrow">TRAIN LOG</div>
  <div class="header-top">
    <div class="header-title">TODAY</div>
    <div id="header-streak"></div>
  </div>
</div>

<div class="content" id="app"></div>
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="switchTab('train')" id="nav-train"><span class="nav-icon">🏋️</span><span class="nav-label">Train</span></button>
  <button class="nav-btn" onclick="switchTab('calendar')" id="nav-calendar"><span class="nav-icon">📅</span><span class="nav-label">Log</span></button>
  <button class="nav-btn" onclick="switchTab('stats')" id="nav-stats"><span class="nav-icon">📊</span><span class="nav-label">Stats</span></button>
  <button class="nav-btn" onclick="switchTab('body')" id="nav-body"><span class="nav-icon">👤</span><span class="nav-label">Body</span></button>
</nav>
<div id="popup-wrap"></div>

<script>
var PARTS=[
  {id:'chest',   en:'CHEST',    ja:'胸'},
  {id:'arm',     en:'ARM',      ja:'腕'},
  {id:'shoulder',en:'SHOULDER', ja:'肩'},
  {id:'back',    en:'BACK',     ja:'背中'},
  {id:'abs',     en:'ABS',      ja:'腹'},
  {id:'leg',     en:'LEG',      ja:'脚'},
];
var PART_COLORS=['#00e5a0','#4d9fff','#a78bfa','#ff8c42','#ff4d6d','#ffd700'];

var EXERCISES={
  chest:[
    {id:'pushup',     name:'腕立て伏せ',           plans:[{l:'初級',s:2,r:8},{l:'標準',s:3,r:12},{l:'上級',s:4,r:20}],toLimit:true},
    {id:'widepushup', name:'ワイド腕立て',          plans:[{l:'初級',s:2,r:8},{l:'標準',s:3,r:12},{l:'上級',s:4,r:15}],toLimit:false},
    {id:'diampushup', name:'ダイヤモンド腕立て',    plans:[{l:'初級',s:2,r:5},{l:'標準',s:3,r:10},{l:'上級',s:3,r:15}],toLimit:true},
  ],
  arm:[
    {id:'dip',        name:'ディップス（椅子）',    plans:[{l:'初級',s:2,r:8},{l:'標準',s:3,r:12},{l:'上級',s:4,r:15}],toLimit:true},
    {id:'chinup',     name:'斜め懸垂',              plans:[{l:'初級',s:2,r:5},{l:'標準',s:3,r:8},{l:'上級',s:4,r:12}],toLimit:true},
    {id:'hammercurl', name:'ハンマーカール',         plans:[{l:'初級',s:2,r:10},{l:'標準',s:3,r:15},{l:'上級',s:4,r:20}],toLimit:false},
  ],
  shoulder:[
    {id:'pikepushup', name:'パイクプッシュアップ',  plans:[{l:'初級',s:2,r:6},{l:'標準',s:3,r:10},{l:'上級',s:4,r:15}],toLimit:true},
    {id:'lateralraise',name:'ラテラルレイズ',       plans:[{l:'初級',s:2,r:10},{l:'標準',s:3,r:15},{l:'上級',s:4,r:20}],toLimit:false},
    {id:'shoulderpress',name:'肩プレス',            plans:[{l:'初級',s:2,r:10},{l:'標準',s:3,r:15},{l:'上級',s:4,r:20}],toLimit:false},
  ],
  back:[
    {id:'superman',   name:'スーパーマン',          plans:[{l:'初級',s:2,r:10},{l:'標準',s:3,r:15},{l:'上級',s:4,r:20}],toLimit:false},
    {id:'invrow',     name:'斜め懸垂（テーブル）',  plans:[{l:'初級',s:2,r:5},{l:'標準',s:3,r:10},{l:'上級',s:4,r:12}],toLimit:true},
    {id:'goodmorning',name:'グッドモーニング',       plans:[{l:'初級',s:2,r:12},{l:'標準',s:3,r:15},{l:'上級',s:4,r:20}],toLimit:false},
  ],
  abs:[
    {id:'crunch',     name:'クランチ',              plans:[{l:'初級',s:2,r:10},{l:'標準',s:3,r:20},{l:'上級',s:4,r:30}],toLimit:false},
    {id:'plank',      name:'プランク（秒）',         plans:[{l:'初級',s:2,r:20},{l:'標準',s:3,r:30},{l:'上級',s:3,r:60}],toLimit:false},
    {id:'legrise',    name:'レッグレイズ',           plans:[{l:'初級',s:2,r:10},{l:'標準',s:3,r:15},{l:'上級',s:4,r:20}],toLimit:true},
  ],
  leg:[
    {id:'squat',      name:'スクワット',             plans:[{l:'初級',s:2,r:10},{l:'標準',s:3,r:20},{l:'上級',s:4,r:30}],toLimit:false},
    {id:'lunge',      name:'ランジ',                 plans:[{l:'初級',s:2,r:8},{l:'標準',s:3,r:12},{l:'上級',s:4,r:15}],toLimit:false},
    {id:'calfraise',  name:'カーフレイズ',           plans:[{l:'初級',s:2,r:15},{l:'標準',s:3,r:20},{l:'上級',s:4,r:30}],toLimit:false},
  ],
};

var TIPS=[
  '筋肉は休息中に育ちます。睡眠をしっかり取ることが最大のトレーニングです。',
  'プロテインは運動後30分以内に摂取すると効果的です。',
  '同じ部位は48〜72時間の休息を入れると筋肉が育ちやすいです。',
  '水分補給を忘れずに。パフォーマンスが大きく変わります。',
  '正しいフォームなら、少ない回数でも十分な効果があります。',
  '週3回を半年続けた人は、毎日やって1ヶ月で辞めた人より結果が出ます。',
  '自重トレーニングは関節への負担が少なく、長く続けられます。',
  '腹筋は毎日鍛えても回復が早い部位です。ただし、食事が9割。',
];

var BADGES=[
  {id:'first',    emoji:'🌱',name:'FIRST STEP',  cond:'初めてのトレーニング', check:function(d){return d.total>=1;}},
  {id:'streak3',  emoji:'🔥',name:'3 DAY FIRE',  cond:'3日連続',             check:function(d){return d.streak>=3;}},
  {id:'streak7',  emoji:'⚡',name:'WEEK BEAST',  cond:'7日連続',             check:function(d){return d.streak>=7;}},
  {id:'streak30', emoji:'💎',name:'IRON WILL',   cond:'30日連続',            check:function(d){return d.streak>=30;}},
  {id:'rep100',   emoji:'💯',name:'100 REPS',    cond:'累計100回以上',       check:function(d){return d.reps>=100;}},
  {id:'rep500',   emoji:'🏆',name:'500 REPS',    cond:'累計500回以上',       check:function(d){return d.reps>=500;}},
  {id:'allparts', emoji:'🌟',name:'FULL BODY',   cond:'全6部位を制覇',       check:function(d){return d.parts>=6;}},
  {id:'sess10',   emoji:'🎯',name:'10 SESSIONS', cond:'10回トレーニング',    check:function(d){return d.sessions>=10;}},
  {id:'sess30',   emoji:'👑',name:'30 SESSIONS', cond:'30回トレーニング',    check:function(d){return d.sessions>=30;}},
];

var S={
  tab:'train',flow:'select_part',
  selectedPart:null,selectedEx:null,selectedPlan:1,
  currentSetIdx:0,setResults:[],todaySessions:[],
  calYear:new Date().getFullYear(),calMonth:new Date().getMonth(),
  records:{},
  tip:TIPS[Math.floor(Math.random()*TIPS.length)],
};

function load(){try{var s=localStorage.getItem('tl2');if(s){var p=JSON.parse(s);S.records=p.records||{};}}catch(e){}}
function save(){try{localStorage.setItem('tl2',JSON.stringify({records:S.records}));}catch(e){}}
function pad(n){return String(n).padStart(2,'0');}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dateKey(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d);}

function calcStreak(){
  var s=0;var t=new Date();t.setHours(0,0,0,0);
  for(var i=0;i<365;i++){var d=new Date(t.getTime());d.setDate(d.getDate()-i);var k=dateKey(d.getFullYear(),d.getMonth(),d.getDate());if(S.records[k]&&S.records[k].length>0)s++;else break;}
  return s;
}
function calcTotalReps(){var t=0;Object.values(S.records).forEach(function(ss){ss.forEach(function(s){t+=s.totalReps;});});return t;}
function calcTotalSessions(){var t=0;Object.values(S.records).forEach(function(ss){t+=ss.length;});return t;}
function calcPartReps(id){var t=0;Object.values(S.records).forEach(function(ss){ss.forEach(function(s){if(s.part===id)t+=s.totalReps;});});return t;}
function calcPartsUsed(){var u={};Object.values(S.records).forEach(function(ss){ss.forEach(function(s){u[s.part]=true;});});return Object.keys(u).length;}
function calcMonthSessions(){var now=new Date();var t=0;Object.keys(S.records).forEach(function(k){var p=k.split('-');if(parseInt(p[0])===now.getFullYear()&&parseInt(p[1])-1===now.getMonth())t+=S.records[k].length;});return t;}
function getBadgeData(){return{streak:calcStreak(),reps:calcTotalReps(),sessions:calcTotalSessions(),parts:calcPartsUsed(),total:calcTotalSessions()};}

// 部位ごとの日別累計（折れ線用）
function calcPartTimeline(partId){
  var keys=Object.keys(S.records).sort();
  var result=[];var cumul=0;
  keys.forEach(function(k){
    S.records[k].forEach(function(s){if(s.part===partId)cumul+=s.totalReps;});
    result.push({date:k,val:cumul});
  });
  return result;
}

function getComment(){
  var sessions=S.todaySessions;
  if(!sessions.length)return 'お疲れ様！記録を保存しました。';
  var total=0;sessions.forEach(function(s){s.sets.forEach(function(st){total+=st.reps;});});
  var yk=new Date();yk.setDate(yk.getDate()-1);
  var yKey=dateKey(yk.getFullYear(),yk.getMonth(),yk.getDate());
  var yReps=0;(S.records[yKey]||[]).forEach(function(s){yReps+=s.totalReps;});
  if(yReps>0&&total>yReps)return '⬆️ 昨日より'+(total-yReps)+'回多い！絶好調！';
  if(total>=50)return '🔥 合計'+total+'回！今日は本気出たね！';
  return '💪 合計'+total+'回！着実に強くなってます！';
}

function switchTab(t){
  S.tab=t;
  ['train','calendar','stats','body'].forEach(function(id){document.getElementById('nav-'+id).classList.toggle('active',id===t);});
  render();
}

function render(){
  var app=document.getElementById('app');if(!app)return;
  var streak=calcStreak();
  var sh=document.getElementById('header-streak');
  if(sh)sh.innerHTML=streak>0?'<span class="header-streak">🔥 '+streak+' DAY STREAK</span>':'';
  if(S.tab==='train')app.innerHTML=renderTrain();
  else if(S.tab==='calendar')app.innerHTML=renderCalendar();
  else if(S.tab==='stats')app.innerHTML=renderStats();
  else{app.innerHTML=renderBody();drawCharts();}
}

// ===== TRAIN =====
function renderTrain(){
  if(S.flow==='select_part')return renderSelectPart();
  if(S.flow==='select_ex')return renderSelectEx();
  if(S.flow==='select_plan')return renderSelectPlan();
  if(S.flow==='recording')return renderRecording();
  if(S.flow==='finish')return renderFinish();
  return '';
}

function renderSelectPart(){

  h+='<div class="card"><div class="section-label">部位を選択</div><div class="part-grid">';
  PARTS.forEach(function(p){
    h+='<button class="part-btn" onclick="selectPart(\''+p.id+'\')">'+
      '<span class="part-en">'+p.en+'</span>'+
      '<span class="part-ja">'+p.ja+'</span>'+
      '<div class="part-line"></div>'+
    '</button>';
  });
  h+='</div></div>';
  if(S.todaySessions.length>0){
    h+='<div class="card"><div class="section-label">今日の記録</div>';
    S.todaySessions.forEach(function(sess){
      var total=0;sess.sets.forEach(function(st){total+=st.reps;});
      h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)">'+
        '<div><div style="font-size:13px;font-weight:600">'+sess.exName+'</div>'+
        '<div style="font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:2px">'+sess.sets.length+' SETS</div></div>'+
        '<div style="font-family:Bebas Neue,sans-serif;font-size:24px;color:var(--accent)">'+total+'<span style="font-size:11px;color:var(--muted);font-family:DM Sans,sans-serif"> reps</span></div>'+
      '</div>';
    });
    h+='<button class="action-btn primary" style="margin-top:14px" onclick="finishAll()">FINISH TODAY</button></div>';
  }
  return h;
}

function selectPart(id){S.selectedPart=id;S.flow='select_ex';render();}

function renderSelectEx(){
  var part=PARTS.find(function(p){return p.id===S.selectedPart;});
  var h='<button class="back-btn" onclick="S.flow=\'select_part\';render()">← BACK</button>';
  h+='<div class="card"><div class="section-label">'+part.en+' — 種目を選ぶ</div>';
  EXERCISES[S.selectedPart].forEach(function(ex){
    h+='<div class="ex-item" onclick="selectEx(\''+ex.id+'\')">'+
      '<div><div class="ex-name">'+ex.name+'</div>'+(ex.toLimit?'<span class="ex-badge">LIMIT SET INCLUDED</span>':'')+'</div>'+
      '<span class="ex-arrow">GO →</span></div>';
  });
  h+='</div>';return h;
}

function selectEx(id){
  var list=EXERCISES[S.selectedPart];
  S.selectedEx=list.find(function(e){return e.id===id;});
  S.selectedPlan=1;S.flow='select_plan';render();
}

function renderSelectPlan(){
  var ex=S.selectedEx;
  var h='<button class="back-btn" onclick="S.flow=\'select_ex\';render()">← BACK</button>';
  h+='<div class="card"><div class="section-label">'+ex.name+' — プランを選ぶ</div><div class="plan-row">';
  ex.plans.forEach(function(plan,i){
    h+='<button class="plan-btn'+(S.selectedPlan===i?' active':'')+'" onclick="S.selectedPlan='+i+';render()">'+
      '<div class="plan-level">'+plan.l+'</div>'+
      '<div class="plan-detail">'+plan.s+'SET × '+plan.r+'rep'+(ex.toLimit&&i===ex.plans.length-1?'+LIMIT':'')+'</div>'+
    '</button>';
  });
  h+='</div></div>';
  h+='<button class="action-btn primary" onclick="startRecording()">START →</button>';
  return h;
}

function startRecording(){S.currentSetIdx=0;S.setResults=[];S.flow='recording';render();}

function renderRecording(){
  var ex=S.selectedEx;var plan=ex.plans[S.selectedPlan];
  var totalSets=plan.s+(ex.toLimit?1:0);
  var pct=totalSets>0?Math.round(S.currentSetIdx/totalSets*100):0;
  var h='<div class="card" style="margin-bottom:10px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+
    '<div style="font-size:15px;font-weight:700">'+ex.name+'</div>'+
    '<div style="font-family:Bebas Neue,sans-serif;font-size:18px;color:var(--muted)">'+S.currentSetIdx+' / '+totalSets+'</div></div>'+
    '<div class="prog-wrap"><div class="prog-bar" style="width:'+pct+'%"></div></div></div>';
  S.setResults.forEach(function(res,i){
    var isLim=ex.toLimit&&i===plan.s;
    h+='<div class="set-record-card">'+
      '<div class="set-num">'+(isLim?'LIMIT SET':'SET '+(i+1))+'</div>'+
      '<div style="margin-top:8px;display:flex;align-items:center;gap:8px">'+
      (res.giveup?'<span class="set-giveup-label">GIVE UP — '+res.reps+' reps</span>':
        '<span class="set-done-num">'+res.reps+'</span><span class="set-done-label">reps</span>')+
      '</div></div>';
  });
  if(S.currentSetIdx<totalSets){
    var isLimitSet=ex.toLimit&&S.currentSetIdx===plan.s;
    h+='<div class="set-record-card active-set">'+
      '<div class="set-num" style="color:var(--accent)">'+(isLimitSet?'🔥 LIMIT SET — 限界まで！':'SET '+(S.currentSetIdx+1)+' / '+totalSets)+'</div>'+
      '<div class="input-row">'+
      '<input type="number" id="rep-input" class="rep-input" value="'+(isLimitSet?'':plan.r)+'" min="0" placeholder="0">'+
      '<span class="rep-label">REPS</span>'+
      '<button class="giveup-btn" onclick="doGiveup()">GIVE UP</button>'+
      '<button class="done-btn" onclick="doneSet()">DONE ✓</button>'+
      '</div></div>';
  }
  if(S.currentSetIdx>=totalSets){
    h+='<button class="action-btn primary" onclick="finishExercise()">✓ COMPLETE</button>';
    h+='<button class="action-btn secondary" onclick="S.flow=\'select_part\';render()">CANCEL</button>';
  }
  return h;
}

function doneSet(){var i=document.getElementById('rep-input');S.setResults.push({reps:i?parseInt(i.value)||0:0,giveup:false});S.currentSetIdx++;render();}
function doGiveup(){var i=document.getElementById('rep-input');S.setResults.push({reps:i?parseInt(i.value)||0:0,giveup:true});S.currentSetIdx++;render();}

function finishExercise(){
  var ex=S.selectedEx;var total=0;S.setResults.forEach(function(r){total+=r.reps;});
  S.todaySessions.push({part:S.selectedPart,exId:ex.id,exName:ex.name,plan:ex.plans[S.selectedPlan].l,sets:S.setResults.slice(),totalReps:total});
  S.flow='select_part';S.tip=TIPS[Math.floor(Math.random()*TIPS.length)];render();
}

function finishAll(){
  var tk=todayKey();if(!S.records[tk])S.records[tk]=[];
  S.todaySessions.forEach(function(sess){S.records[tk].push(sess);});
  save();S.flow='finish';render();
}

function renderFinish(){
  var total=0;S.todaySessions.forEach(function(s){s.sets.forEach(function(st){total+=st.reps;});});
  var h='<div class="finish-wrap">'+
    '<div class="finish-big">DONE!</div>'+
    '<div class="finish-stats">'+
      '<div class="finish-stat"><div class="finish-stat-num">'+S.todaySessions.length+'</div><div class="finish-stat-label">EXERCISES</div></div>'+
      '<div class="finish-stat"><div class="finish-stat-num">'+total+'</div><div class="finish-stat-label">TOTAL REPS</div></div>'+
    '</div>'+
    '<div class="comment-card"><div class="comment-text">'+getComment()+'</div></div></div>';
  var bd=getBadgeData();
  var newB=BADGES.filter(function(b){return b.check(bd);});
  if(newB.length){

  h+='<button class="action-btn secondary" onclick="S.todaySessions=[];S.flow=\'select_part\';switchTab(\'stats\')">VIEW STATS →</button>';

// ===== CALENDAR =====
function renderCalendar(){
  var y=S.calYear;var m=S.calMonth;
  var firstDow=new Date(y,m,1).getDay();
  var dim=new Date(y,m+1,0).getDate();
  var mNames=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var tk=todayKey();
  var h='<div class="card">'+
    '<div class="cal-nav-row">'+
    '<button class="cal-nav-btn" onclick="S.calMonth--;if(S.calMonth<0){S.calMonth=11;S.calYear--;}render()">‹</button>'+
    '<div class="cal-month">'+mNames[m]+' '+y+'</div>'+
    '<button class="cal-nav-btn" onclick="S.calMonth++;if(S.calMonth>11){S.calMonth=0;S.calYear++;}render()">›</button>'+
    '</div><div class="cal-grid">'+
    ['SU','MO','TU','WE','TH','FR','SA'].map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join('');
  for(var i=0;i<firstDow;i++)h+='<div class="cal-cell empty"></div>';
  for(var d=1;d<=dim;d++){
    var k=dateKey(y,m,d);var hasW=S.records[k]&&S.records[k].length>0;var isT=k===tk;
    var dow=new Date(y,m,d).getDay();
    h+='<button class="cal-cell'+(hasW?' has-workout':'')+(isT?' today':'')+'" onclick="showDay(\''+k+'\')" style="'+(dow===0||dow===6?'opacity:0.4;':'')+'">'+d+(hasW?'<div class="cal-dot"></div>':'')+'</button>';
  }
  h+='</div></div>';
  var monthKeys=[];for(var dd=1;dd<=dim;dd++){var kk=dateKey(y,m,dd);if(S.records[kk]&&S.records[kk].length>0)monthKeys.push(kk);}
  if(monthKeys.length){
    h+='<div class="card"><div class="section-label">'+mNames[m]+' SESSIONS</div>';
    monthKeys.forEach(function(k){
      var ss=S.records[k];var t=0;ss.forEach(function(s){t+=s.totalReps;});
      h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="showDay(\''+k+'\')">'+
        '<div><div style="font-family:Bebas Neue,sans-serif;font-size:18px;letter-spacing:1px">'+k.split('-')[2]+' '+mNames[m]+'</div>'+
        '<div style="font-size:11px;color:var(--muted);margin-top:2px">'+ss.map(function(s){return s.exName;}).join(' · ')+'</div></div>'+
        '<div style="font-family:Bebas Neue,sans-serif;font-size:24px;color:var(--accent)">'+t+'<span style="font-size:10px;font-family:DM Sans,sans-serif;color:var(--muted)"> reps</span></div>'+
      '</div>';
    });
    h+='</div>';
  }
  return h;
}

  var ss=S.records[k]||[];var p=k.split('-');
  var wrap=document.getElementById('popup-wrap');
  var inner='<div class="popup-overlay" onclick="if(event.target===this)document.getElementById(\'popup-wrap\').innerHTML=\'\'">'+
    '<div class="popup-box"><div class="popup-title">'+p[2]+' / '+p[1]+' / '+p[0]+'</div>';
  if(!ss.length){inner+='<div style="color:var(--muted);font-size:14px;padding:20px 0;text-align:center;letter-spacing:2px">NO RECORD</div>';}
  else{ss.forEach(function(sess){

    inner+='<div style="padding:12px 0;border-bottom:1px solid var(--border)">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
      '<div style="font-size:14px;font-weight:700">'+sess.exName+'</div>'+
      '<div style="font-family:Bebas Neue,sans-serif;font-size:20px;color:var(--accent)">'+t+' reps</div></div>';
    sess.sets.forEach(function(st,i){
      inner+='<div style="font-size:11px;color:var(--muted);letter-spacing:1px;margin-left:8px">SET '+(i+1)+' — '+(st.giveup?st.reps+' reps (GIVE UP)':st.reps+' reps')+'</div>';
    });

  });}
  inner+='<button class="popup-close" onclick="document.getElementById(\'popup-wrap\').innerHTML=\'\'">CLOSE</button></div></div>';

function drawCharts(){
  drawRadar();drawLine();
}

function drawRadar(){
  var canvas=document.getElementById('radar-chart');if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  var cx=W/2,cy=H/2,R=100;
  var n=6;
  var partReps=PARTS.map(function(p){return calcPartReps(p.id);});
  var maxR=Math.max.apply(null,partReps.concat([1]));
  // grid
  for(var g=1;g<=4;g++){
    ctx.beginPath();
    for(var i=0;i<n;i++){
      var angle=-Math.PI/2+i*2*Math.PI/n;
      var x=cx+(R*g/4)*Math.cos(angle),y=cy+(R*g/4)*Math.sin(angle);
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.stroke();
  }
  // axes
  for(var i=0;i<n;i++){
    var angle=-Math.PI/2+i*2*Math.PI/n;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+R*Math.cos(angle),cy+R*Math.sin(angle));
    ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;ctx.stroke();
  }
  // data
  ctx.beginPath();
  for(var i=0;i<n;i++){
    var angle=-Math.PI/2+i*2*Math.PI/n;
    var r=R*(partReps[i]/maxR);
    var x=cx+r*Math.cos(angle),y=cy+r*Math.sin(angle);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle='rgba(0,229,160,0.15)';ctx.fill();
  ctx.strokeStyle='rgba(0,229,160,0.8)';ctx.lineWidth=2;ctx.stroke();
  // dots + labels
  for(var i=0;i<n;i++){
    var angle=-Math.PI/2+i*2*Math.PI/n;
    var r=R*(partReps[i]/maxR);
    var x=cx+r*Math.cos(angle),y=cy+r*Math.sin(angle);
    ctx.beginPath();ctx.arc(x,y,4,0,2*Math.PI);
    ctx.fillStyle=PART_COLORS[i];ctx.fill();
    var lx=cx+(R+20)*Math.cos(angle),ly=cy+(R+20)*Math.sin(angle);
    ctx.font='bold 10px Bebas Neue,sans-serif';ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(PARTS[i].en,lx,ly);
  }
}

function drawLine(){
  var canvas=document.getElementById('line-chart');if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  var PAD={t:20,r:20,b:40,l:40};
  var cW=W-PAD.l-PAD.r,cH=H-PAD.t-PAD.b;
  // 全日付収集
  var allDates=Object.keys(S.records).sort();
  if(allDates.length===0){
    ctx.font='12px DM Sans,sans-serif';ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.textAlign='center';ctx.fillText('トレーニング記録がありません',W/2,H/2);return;
  }
  // 部位ごとcumul
  var timelines=PARTS.map(function(p){
    var cumul=0;
    return allDates.map(function(k){
      (S.records[k]||[]).forEach(function(s){if(s.part===p.id)cumul+=s.totalReps;});
      return cumul;
    });
  });
  var maxVal=Math.max.apply(null,timelines.map(function(t){return Math.max.apply(null,t.concat([0]));}).concat([1]));
  // grid
  for(var g=0;g<=4;g++){
    var y=PAD.t+cH*(1-g/4);
    ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(PAD.l+cW,y);
    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;ctx.stroke();
    ctx.font='9px DM Mono,sans-serif';ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.textAlign='right';ctx.fillText(Math.round(maxVal*g/4),PAD.l-6,y+4);
  }
  // lines
  timelines.forEach(function(data,pi){
    if(Math.max.apply(null,data)===0)return;
    ctx.beginPath();
    data.forEach(function(val,i){
      var x=PAD.l+(allDates.length>1?cW*i/(allDates.length-1):cW/2);
      var y=PAD.t+cH*(1-val/maxVal);
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    });
    ctx.strokeStyle=PART_COLORS[pi];ctx.lineWidth=2;ctx.stroke();
    // last dot
    var lastVal=data[data.length-1];
    var lx=PAD.l+(allDates.length>1?cW:cW/2);
    var ly=PAD.t+cH*(1-lastVal/maxVal);
    ctx.beginPath();ctx.arc(lx,ly,4,0,2*Math.PI);ctx.fillStyle=PART_COLORS[pi];ctx.fill();
  });
  // x labels
  var step=Math.ceil(allDates.length/4);
  allDates.forEach(function(k,i){
    if(i%step===0||i===allDates.length-1){
      var x=PAD.l+(allDates.length>1?cW*i/(allDates.length-1):cW/2);
      var p=k.split('-');
      ctx.font='9px DM Mono,sans-serif';ctx.fillStyle='rgba(255,255,255,0.3)';
      ctx.textAlign='center';ctx.fillText(p[1]+'/'+p[2],x,H-PAD.b+14);
    }
  });
}

load();render();
</script>
</body>
</html>
